name: Configure Pages custom domain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - CNAME
      - .github/workflows/configure-pages-domain.yml

permissions:
  contents: read
  pages: write

jobs:
  configure-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Register redirect domain
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/pages" \
            --data '{"cname":"daya.mchurch.online"}'

      - name: Enable HTTPS when available
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/pages" \
            --data '{"https_enforced":true}' || true
